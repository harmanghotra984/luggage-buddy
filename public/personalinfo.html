<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post an Ad - Luggage Space Sharing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>Post an Ad for Extra Space</h2>
    <form id="offerForm" enctype="multipart/form-data">
      <input type="text" id="title" placeholder="Title" required><br>
      <textarea id="description" placeholder="Description" required></textarea><br>
      <input type="text" id="location" placeholder="Location" required><br>
      <input type="file" id="images" multiple accept="image/*"><br>
      <button type="submit" class="btn">Post Ad</button>
    </form>
    <a href="dashboard.html">Back to Dashboard</a>
  </div>
  <script src="personalinfo.js"></script>
</body>
</html>
